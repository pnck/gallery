[package]
name = "gallery-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "BYOS Gallery Tier-1 transport core: local SOCKS5 inbound + (upcoming) userspace WireGuard chain, exposed to Kotlin via UniFFI."
license = "Apache-2.0"

[lib]
name = "gallery_transport"
# rlib so host integration tests can link; cdylib/staticlib for the Android build.
crate-type = ["lib", "cdylib", "staticlib"]

# Standalone binding generator (uniffi-bindgen) so no separate cargo install is needed.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
log = "0.4"
thiserror = "1"

# Tier-1 WireGuard core (T-502 phase 2). boringtun = WG protocol only (sans-io,
# pure-Rust crypto — cross-compiles cleanly for Android); smoltcp = userspace
# TCP/IP; keys are base64 x25519. No TUN, no system VPN (Transport §2.1).
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    # In-tunnel DNS (WgOnly resolves via the WG-configured DNS over the tunnel,
    # not the phone's local resolver — no DNS leak).
    "socket-udp",
    "socket-dns",
    # Route smoltcp's internal routing/dispatch traces through `log` → logcat,
    # so "can't reach X" issues (rejected routes, unreachable) are observable.
    "log",
] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
rand = "0.8"

# Bridge `log` to Android logcat so the transport core is debuggable on-device
# (`adb logcat -s gallery-wg`). Android-only; host/CI builds don't need it.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
env_filter = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
# NO panic = "abort": the WG driver's panic guard (catch_unwind in wg.rs) must be
# able to catch a driver-thread panic so it can zero the health atoms and fail
# connections instead of taking down the whole app process.
