name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: write # create/update GitHub Releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to derive alpha versions

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── Rust transport core (EPIC-5). The runner is x86_64, so unlike the arm64
      # dev container the Android NDK toolchains are native and cargo-ndk works. ──
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ^3 --locked

      # Use the NDK preinstalled on the runner image (a complete llvm toolchain
      # boringtun/ring can compile against). The nttld/setup-ndk r27c package ships
      # without the clang symlink `ring`'s build script expects, so we avoid it.
      - name: Select Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            || { echo "::error::no usable NDK clang under $ndk"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "Using NDK at $ndk"

      # The checked-in UniFFI Kotlin bindings must never drift from the Rust FFI
      # surface. Regenerate from a host build and fail if they differ.
      - name: Verify UniFFI bindings are up to date
        run: |
          bash core-transport/regen-bindings.sh
          git diff --exit-code core-transport/src/main/uniffi \
            || { echo "::error::UniFFI bindings are stale — run core-transport/regen-bindings.sh and commit."; exit 1; }

      # Surface whether the OAuth client id was injected, WITHOUT printing its value
      # — a stale/misnamed secret otherwise fails silently (green build, can't sign in).
      - name: Check OAuth client id is injected
        env:
          CID: ${{ secrets.GALLERY_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$CID" ]; then
            echo "::warning::GALLERY_GOOGLE_CLIENT_ID is empty — the APK will build but cannot sign in."
          else
            echo "OAuth client id present (length ${#CID})."
          fi

      # Release versioning:
      #  - main push  → rolling pre-release vBASE-alpha.N. BASE comes from the
      #    repo-tracked file `release-next-base` when present (explicit line
      #    transitions, e.g. 0.2.0 after the final 0.1.x tag); otherwise it is
      #    derived from the newest stable vA.B.C tag as vA.B.(C+1). N counts
      #    ROLLING RELEASES, not commits: highest existing alpha number for that
      #    base + 1 (one push = one roll, consecutive even for multi-commit
      #    pushes; pruned old alphas don't break monotonicity). A new base
      #    restarts N at 1 automatically. No stable tag yet → v0.1.0-alpha.N.
      #  - tag push   → official release named after the tag (vA.B.C).
      - name: Compute release version
        id: ver
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          else
            if [ -s release-next-base ]; then
              base="v$(tr -d '[:space:]' < release-next-base)"
            else
              latest=$(git tag -l 'v*' --sort=-v:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
              if [ -n "$latest" ]; then
                IFS=. read -r a b c <<< "${latest#v}"
                base="v$a.$b.$((c+1))"
              else
                base="v0.1.0"
              fi
            fi
            last=$(git tag -l "$base-alpha.*" --sort=-v:refname | head -1 || true)
            n=$(( ${last##*-alpha.} + 1 )) 2>/dev/null || n=1
            v="$base-alpha.$n"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version_name=${v#v}" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

      # `build` = assemble + check: unit tests for all modules + Android Lint.
      # -Pgallery.buildRust=true wires cargo-ndk into the Android build so the
      # transport .so is cross-compiled and packaged per ABI. The OAuth client id/
      # secret come from repo secrets (empty if unset — the APK then builds but
      # cannot sign in; provide them to produce a login-capable artifact).
      - name: Build
        run: >-
          ./gradlew build -Pgallery.buildRust=true
          -PGALLERY_VERSION_CODE=${{ github.run_number }}
          -PGALLERY_VERSION_NAME=${{ steps.ver.outputs.version_name }}
          -PGALLERY_GOOGLE_CLIENT_ID=${{ secrets.GALLERY_GOOGLE_CLIENT_ID }}
          -PGALLERY_GOOGLE_CLIENT_SECRET=${{ secrets.GALLERY_GOOGLE_CLIENT_SECRET }}
          -PGALLERY_GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GALLERY_GOOGLE_DESKTOP_CLIENT_ID }}
          -PGALLERY_GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GALLERY_GOOGLE_DESKTOP_CLIENT_SECRET }}
          --stacktrace

      # Fail loudly if the transport core .so didn't make it into the APKs — a
      # silently-missing lib would only surface as a runtime UnsatisfiedLinkError.
      - name: Verify transport .so is packaged
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk \
                     app/build/outputs/apk/release/app-release.apk; do
            echo "ABIs carrying libgallery_transport.so in $apk:"
            unzip -l "$apk" | grep 'libgallery_transport.so' || {
              echo "::error::libgallery_transport.so missing from $apk"; exit 1; }
          done

      - name: Upload lint & test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1  # quota: published APKs live in Releases, artifacts are short-lived debug aids

      # ── Releases (push events only; PRs stop at the artifact above) ──────────
      # Rolling alphas publish the DEBUG build only (they're test aids). Official
      # tag releases publish BOTH variants. Both are signed with the committed
      # debug key, so any CI/local build installs and upgrades cleanly.

      # Rolling pre-release on every main push. Idempotent: a re-run of the same
      # commit recomputes the same version, so drop a stale same-named release
      # first (gh release create refuses an existing tag).
      - name: Publish rolling pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/debug/app-debug.apk "gallery-$v.apk"
          gh release delete "$v" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$v" "gallery-$v.apk" \
            --title "$v" --prerelease --generate-notes \
            || gh release create "$v" "gallery-$v.apk" \
                 --title "$v" --prerelease --notes "Rolling pre-release $v"

      # Official release from a manually pushed vA.B.C tag — TWO APKs:
      # gallery-$v.apk is the minified release build (diagnostics stripped);
      # gallery-$v-debug.apk is the debug build. Both are signed with the same
      # committed debug key (see app/build.gradle.kts), so either upgrades the
      # other cleanly.
      - name: Publish official release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "gallery-$v.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "gallery-$v-debug.apk"
          gh release create "$v" "gallery-$v.apk" "gallery-$v-debug.apk" \
            --title "$v" --verify-tag --generate-notes \
            || gh release create "$v" "gallery-$v.apk" "gallery-$v-debug.apk" \
                 --title "$v" --verify-tag --notes "Release $v"

      # Keep the release list bounded: retain the 5 newest alpha pre-releases,
      # delete the rest (and their tags). Official releases are never pruned.
      - name: Prune old alpha pre-releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-alpha\\.[0-9]+$"))) | .tagName] | .[5:][]' \
          | while read -r t; do
              echo "Pruning $t"
              gh release delete "$t" --yes --cleanup-tag || true
            done
