name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── Rust transport core (EPIC-5). The runner is x86_64, so unlike the arm64
      # dev container the Android NDK toolchains are native and cargo-ndk works. ──
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ^3 --locked

      # Use the NDK preinstalled on the runner image (a complete llvm toolchain
      # boringtun/ring can compile against). The nttld/setup-ndk r27c package ships
      # without the clang symlink `ring`'s build script expects, so we avoid it.
      - name: Select Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            || { echo "::error::no usable NDK clang under $ndk"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "Using NDK at $ndk"

      # The checked-in UniFFI Kotlin bindings must never drift from the Rust FFI
      # surface. Regenerate from a host build and fail if they differ.
      - name: Verify UniFFI bindings are up to date
        run: |
          bash core-transport/regen-bindings.sh
          git diff --exit-code core-transport/src/main/uniffi \
            || { echo "::error::UniFFI bindings are stale — run core-transport/regen-bindings.sh and commit."; exit 1; }

      # Surface whether the OAuth client id was injected, WITHOUT printing its value
      # — a stale/misnamed secret otherwise fails silently (green build, can't sign in).
      - name: Check OAuth client id is injected
        env:
          CID: ${{ secrets.GALLERY_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$CID" ]; then
            echo "::warning::GALLERY_GOOGLE_CLIENT_ID is empty — the APK will build but cannot sign in."
          else
            echo "OAuth client id present (length ${#CID})."
          fi

      # `build` = assemble + check: unit tests for all modules + Android Lint.
      # -Pgallery.buildRust=true wires cargo-ndk into the Android build so the
      # transport .so is cross-compiled and packaged per ABI. The OAuth client id/
      # secret come from repo secrets (empty if unset — the APK then builds but
      # cannot sign in; provide them to produce a login-capable artifact).
      - name: Build
        run: >-
          ./gradlew build -Pgallery.buildRust=true
          -PGALLERY_GOOGLE_CLIENT_ID=${{ secrets.GALLERY_GOOGLE_CLIENT_ID }}
          -PGALLERY_GOOGLE_CLIENT_SECRET=${{ secrets.GALLERY_GOOGLE_CLIENT_SECRET }}
          --stacktrace

      # Fail loudly if the transport core .so didn't make it into the APK — a
      # silently-missing lib would only surface as a runtime UnsatisfiedLinkError.
      - name: Verify transport .so is packaged
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          echo "ABIs carrying libgallery_transport.so:"
          unzip -l "$apk" | grep 'libgallery_transport.so' || {
            echo "::error::libgallery_transport.so missing from $apk"; exit 1; }

      - name: Upload lint & test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
